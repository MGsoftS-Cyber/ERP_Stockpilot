[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot-plugin-sdk"
version = "0.1.0"
description = "Local developer toolkit for StockPilot declarative plugin API 1"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stockpilot-plugin = "stockpilot_sdk:main"

[tool.setuptools]
py-modules = ["stockpilot_sdk", "stockpilot_validation"]
