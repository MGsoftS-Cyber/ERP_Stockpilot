server.port=9000
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
# These files are private volumes, never source-control files.
stockpilot.accounts=${IDENTITY_ACCOUNTS:/bootstrap/accounts.json}
stockpilot.signing-key=${IDENTITY_SIGNING_KEY:/data/signing.jwk}
stockpilot.issuer=${OIDC_ISSUER:http://localhost:9000}
stockpilot.web-origin=${WEB_ORIGIN:http://localhost:5173}
