[project]
name = "stockpilot-erp-core"
version = "0.14.0"
description = "StockPilot AI multi-tenant ERP core"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PyJWT[crypto]>=2.10,<3",
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular>=0.28,<0.29",
  "django-cors-headers>=4.7,<5",
  "dj-database-url>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=6,<7",
  "factory-boy>=3.3,<4",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "ruff>=0.11,<0.14",
  "mypy>=1.15,<2",
  "django-stubs[compatible-mypy]>=5.2,<5.3",
  "djangorestframework-stubs[compatible-mypy]>=3.16,<3.17",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
